<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zar Masası</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #10251f; color: #f3e7cd; font-family: Georgia, serif; }
    main { width: min(720px, 94vw); text-align: center; padding: 28px; }
    h1 { letter-spacing: .15em; font-size: clamp(28px, 6vw, 44px); margin: 0 0 12px; }
    p { color: #cbd9ce; font: 16px Arial, sans-serif; line-height: 1.5; }
    .masa { background: radial-gradient(ellipse, #367258, #1a4838); border: 10px solid #664a30; border-radius: 28px; padding: 45px 12px 30px; display: flex; justify-content: center; gap: clamp(25px, 9vw, 100px); box-shadow: 0 16px 35px #0007; }
    .zar { width: 140px; height: 140px; padding: 17px; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); background: linear-gradient(135deg, #fffdf5, #ded7c4); border-radius: 16px; box-shadow: 4px 8px 10px #0007, inset 0 0 0 2px #c8bea6; }
    .nokta { width: 18px; height: 18px; border-radius: 50%; background: #272b27; place-self: center; box-shadow: inset 1px 2px 3px #0008; }
    .etiket { margin: 16px 0 0; color: #d6e3d7; font: bold 14px Arial, sans-serif; }
    #sonuc { min-height: 42px; margin: 24px 0 12px; font: bold 24px Arial, sans-serif; }
    button { border: 0; border-radius: 8px; background: #e7cb91; color: #25362a; font: bold 18px Arial, sans-serif; padding: 12px 38px; cursor: pointer; }
    button:hover { background: #f8dfa9; }
    @media (max-width: 420px) { .zar { width: 110px; height: 110px; padding: 12px; } }
  </style>
</head>
<body>
  <main>
    <h1>ZAR MASASI</h1>
    <p>Oyna'ya bas. Sonra sol ve sağ ok tuşlarıyla zarları at.</p>
    <div class="masa">
      <div><div class="zar" id="zar0"></div><div class="etiket">← SOL OK</div></div>
      <div><div class="zar" id="zar1"></div><div class="etiket">SAĞ OK →</div></div>
    </div>
    <div id="sonuc" aria-live="polite">Başlamak için Oyna'ya bas</div>
    <button id="oyna">Oyna</button>
  </main>
  <script>
    const desenler = {1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8]};
    let zarlar = [null, null], basladi = false;
    const sonuc = document.getElementById('sonuc');
    function ciz() {
      zarlar.forEach((sayi, sira) => {
        const zar = document.getElementById('zar' + sira);
        zar.replaceChildren();
        for (let i = 0; i < 9; i++) {
          const yer = document.createElement('div');
          if (sayi && desenler[sayi].includes(i)) yer.className = 'nokta';
          zar.appendChild(yer);
        }
      });
    }
    document.getElementById('oyna').addEventListener('click', () => {
      zarlar = [null, null]; basladi = true; ciz();
      sonuc.textContent = 'Şimdi ok tuşlarına bas!';
      document.getElementById('oyna').textContent = 'Yeniden Oyna';
    });
    document.addEventListener('keydown', event => {
      if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
      event.preventDefault();
      if (!basladi) { sonuc.textContent = "Önce Oyna'ya bas!"; return; }
      const sira = event.key === 'ArrowLeft' ? 0 : 1;
      if (zarlar[sira] !== null) return;
      zarlar[sira] = Math.floor(Math.random() * 6) + 1;
      ciz();
      sonuc.textContent = zarlar.every(sayi => sayi !== null)
        ? `${zarlar[0]} + ${zarlar[1]} = ${zarlar[0] + zarlar[1]}`
        : 'Şimdi diğer ok tuşuna bas!';
    });
    ciz();
  </script>
</body>
</html>
